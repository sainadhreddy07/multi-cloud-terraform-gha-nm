name: Azure Terraform Deployment

on:
  workflow_call:
    inputs:
      operation:
        description: Terraform operation
        required: true
        type: string
        default: plan
        
  workflow_dispatch:
    inputs:
      operation:
        description: Terraform operation
        required: true
        type: choice
        default: plan
        options: [plan, apply, destroy]


permissions:
  contents: read
  id-token: write


concurrency:
  group: terraform-azure-state
  cancel-in-progress: false


env:
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_USE_OIDC: "true"
  ARM_SAS_TOKEN: ${{ secrets.AZURE_TFSTATE_SAS_TOKEN }}

  TF_VAR_location: ${{ vars.AZURE_LOCATION }}
  TF_VAR_resource_group_name: ${{ vars.AZURE_RESOURCE_GROUP_NAME }}

  TF_VAR_vnet_name: ${{ vars.AZURE_VNET_NAME }}
  TF_VAR_vnet_address_space: ${{ vars.AZURE_VNET_ADDRESS_SPACE_JSON }}
  TF_VAR_subnet_name: ${{ vars.AZURE_SUBNET_NAME }}
  TF_VAR_subnet_address_prefixes: ${{ vars.AZURE_SUBNET_PREFIXES_JSON }}
  TF_VAR_nsg_name: ${{ vars.AZURE_NSG_NAME }}
  TF_VAR_security_rules: ${{ vars.AZURE_SECURITY_RULES_JSON }}

  TF_VAR_nic_name: ${{ vars.AZURE_NIC_NAME }}
  TF_VAR_nic_ip_configuration_name: ${{ vars.AZURE_NIC_IP_CONFIG_NAME }}
  TF_VAR_vm_name: ${{ vars.AZURE_VM_NAME }}
  TF_VAR_vm_size: ${{ vars.AZURE_VM_SIZE }}

  TF_VAR_admin_username: ${{ vars.AZURE_ADMIN_USERNAME }}
  TF_VAR_admin_ssh_public_key: ${{ secrets.AZURE_SSH_PUBLIC_KEY }}

  TF_VAR_os_disk_caching: ${{ vars.AZURE_OS_DISK_CACHING }}
  TF_VAR_os_disk_storage_type: ${{ vars.AZURE_OS_DISK_STORAGE_TYPE }}
  TF_VAR_os_disk_size_gb: ${{ vars.AZURE_OS_DISK_SIZE_GB }}
  TF_VAR_image_publisher: ${{ vars.AZURE_IMAGE_PUBLISHER }}
  TF_VAR_image_offer: ${{ vars.AZURE_IMAGE_OFFER }}
  TF_VAR_image_sku: ${{ vars.AZURE_IMAGE_SKU }}
  TF_VAR_image_version: ${{ vars.AZURE_IMAGE_VERSION }}

  TF_VAR_web_page_title: ${{ vars.AZURE_WEB_PAGE_TITLE }}

  TF_VAR_data_disk_count: ${{ vars.AZURE_DATA_DISK_COUNT }}
  TF_VAR_data_disk_size_gb: ${{ vars.AZURE_DATA_DISK_SIZE_GB }}
  TF_VAR_data_disk_storage_type: ${{ vars.AZURE_DATA_DISK_STORAGE_TYPE }}
  TF_VAR_data_disk_caching: ${{ vars.AZURE_DATA_DISK_CACHING }}

  TF_VAR_load_balancer_name: ${{ vars.AZURE_LB_NAME }}
  TF_VAR_load_balancer_public_ip_name: ${{ vars.AZURE_LB_PUBLIC_IP_NAME }}
  TF_VAR_lb_frontend_name: ${{ vars.AZURE_LB_FRONTEND_NAME }}
  TF_VAR_lb_backend_pool_name: ${{ vars.AZURE_LB_BACKEND_POOL_NAME }}
  TF_VAR_lb_probe_name: ${{ vars.AZURE_LB_PROBE_NAME }}
  TF_VAR_lb_rule_name: ${{ vars.AZURE_LB_RULE_NAME }}
  TF_VAR_lb_outbound_rule_name: ${{ vars.AZURE_LB_OUTBOUND_RULE_NAME }}
  TF_VAR_lb_frontend_port: ${{ vars.AZURE_LB_FRONTEND_PORT }}
  TF_VAR_lb_backend_port: ${{ vars.AZURE_LB_BACKEND_PORT }}
  TF_VAR_lb_probe_path: ${{ vars.AZURE_LB_PROBE_PATH }}
  TF_VAR_lb_probe_interval: ${{ vars.AZURE_LB_PROBE_INTERVAL }}
  TF_VAR_lb_probe_count: ${{ vars.AZURE_LB_PROBE_COUNT }}
  TF_VAR_lb_outbound_ports: ${{ vars.AZURE_LB_OUTBOUND_PORTS }}

  TF_VAR_tags: ${{ vars.AZURE_TAGS_JSON }}


jobs:
  plan:
    if: ${{ inputs.operation == 'plan' || inputs.operation == 'apply' }}
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: terraform/Azure } }
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: 1.17.1, terraform_wrapper: false }
      - run: terraform fmt -recursive
      - run: terraform init -input=false -reconfigure
      - run: terraform validate
      - run: terraform plan -input=false -lock-timeout=5m -out=tfplan
      - run: terraform show -no-color tfplan
      - uses: actions/upload-artifact@v4
        with: { name: azure-tfplan, path: terraform/Azure/tfplan, retention-days: 1 }

  apply:
    if: ${{ inputs.operation == 'apply' }}
    needs: plan
    runs-on: ubuntu-latest
    environment: azure-terraform-apply
    defaults: { run: { working-directory: terraform/Azure } }
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: 1.17.1, terraform_wrapper: false }
      - run: terraform init -input=false -reconfigure
      - uses: actions/download-artifact@v4
        with: { name: azure-tfplan, path: terraform/Azure }
      - run: terraform apply -input=false -lock-timeout=5m tfplan
      - run: terraform output

  destroy:
    if: ${{ inputs.operation == 'destroy' }}
    runs-on: ubuntu-latest
    environment: azure-terraform-destroy
    defaults: { run: { working-directory: terraform/Azure } }
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: 1.17.1, terraform_wrapper: false }
      - run: terraform init -input=false -reconfigure
      - run: terraform plan -destroy -input=false -out=tf-destroy-plan
      - run: terraform show -no-color tf-destroy-plan
      - run: terraform apply -input=false -auto-approve tf-destroy-plan
