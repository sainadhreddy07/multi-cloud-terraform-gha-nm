name: Azure Terraform Deployment

on:
 # Manual execution
  workflow_dispatch:
    inputs:
      operation:
        description: Terraform operation
        required: true
        type: choice
        default: plan
        options:
          - plan
          - apply
          - destroy

  # Reusable workflow execution
  workflow_call:
    inputs:
      operation:
        description: Terraform operation
        required: true
        type: string
        default: plan

    secrets:
      AZURE_CLIENT_ID:
        required: true
      AZURE_TENANT_ID:
        required: true
      AZURE_SUBSCRIPTION_ID:
        required: true
      AZURE_SSH_PUBLIC_KEY:
        required: true


# GitHub Actions permissions
permissions:
  contents: read
  id-token: write


# Prevent concurrent operations against the same Azure state
concurrency:
  group: terraform-azure-state
  cancel-in-progress: false


# Common environment variables
env:
  # Azure OIDC authentication
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

  ARM_USE_OIDC: "true"
  ARM_USE_AZUREAD: "true"

  # Sensitive Terraform input
  TF_VAR_admin_ssh_public_key: ${{ secrets.AZURE_SSH_PUBLIC_KEY }}

  # Terraform execution settings
  TF_IN_AUTOMATION: "true"


jobs:
# ============================================================
# STAGE 1 - TERRAFORM PLAN
# ============================================================
  plan:
    name: Azure - Terraform Plan
    if: ${{ inputs.operation == 'plan' || inputs.operation == 'apply' }}
    runs-on: self-hosted

    defaults:
      run:
        working-directory: terraform/Azure

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Azure Login using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -input=false -reconfigure

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: |
          terraform plan \
            -var-file=azure.tfvars \
            -input=false \
            -lock-timeout=5m \
            -out=tfplan

      - name: Display Terraform Plan
        run: terraform show -no-color tfplan

      - name: Upload Terraform Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: azure-tfplan
          path: terraform/Azure/tfplan
          retention-days: 1


# ============================================================
# STAGE 2 - TERRAFORM APPLY
# ============================================================
  apply:
    name: Azure - Terraform Apply
    if: ${{ inputs.operation == 'apply' }}
    needs: plan
    runs-on: self-hosted
    environment: azure-terraform-apply

    defaults:
      run:
        working-directory: terraform/Azure

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Azure Login using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init -input=false -reconfigure

      - name: Download Terraform Plan Artifact
        uses: actions/download-artifact@v4
        with:
          name: azure-tfplan
          path: terraform/Azure

      - name: Terraform Apply
        run: terraform apply -input=false -lock-timeout=5m tfplan

      - name: Display Terraform Outputs
        run: terraform output

# ============================================================
# STAGE 3 - TERRAFORM DESTROY
# ============================================================
  destroy:
    name: Azure - Terraform Destroy
    if: ${{ inputs.operation == 'destroy' }}
    runs-on: self-hosted
    environment: azure-terraform-destroy

    defaults:
      run:
        working-directory: terraform/Azure

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Azure Login using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init -input=false -reconfigure

      - name: Terraform Destroy Plan
        run: |
          terraform plan \
            -destroy \
            -var-file=azure.tfvars \
            -input=false \
            -lock-timeout=5m \
            -out=tf-destroy-plan

      - name: Display Destroy Plan
        run: terraform show -no-color tf-destroy-plan

      - name: Terraform Destroy Apply
        run: terraform apply -input=false -lock-timeout=5m tf-destroy-plan
