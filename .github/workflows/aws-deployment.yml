
name: AWS Terraform Deployment

on:
  # Manual execution
  workflow_dispatch:
    inputs:
      operation:
        description: Terraform operation
        required: true
        type: choice
        default: plan
        options:
          - plan
          - apply
          - destroy

  # Reusable workflow execution
  workflow_call:
    inputs:
      operation:
        description: Terraform operation
        required: true
        type: string
        default: plan


# GitHub Actions permissions
permissions:
  contents: read
  id-token: write


# Prevent concurrent operations against AWS state
concurrency:
  group: terraform-aws-state
  cancel-in-progress: false


# Common environment settings
env:
  TF_IN_AUTOMATION: "true"


jobs:
# ============================================================
# STAGE 1 - TERRAFORM PLAN
# ============================================================
  plan:
    name: AWS - Terraform Plan
    if: ${{ inputs.operation == 'plan' || inputs.operation == 'apply' }}
    runs-on: self-hosted

    defaults:
      run:
        working-directory: terraform/AWS

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -input=false -reconfigure

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: |
          terraform plan \
            -var-file=aws.tfvars \
            -input=false \
            -lock-timeout=5m \
            -out=tfplan

      - name: Display Terraform Plan
        run: terraform show -no-color tfplan

      - name: Upload Terraform Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aws-tfplan
          path: terraform/AWS/tfplan
          retention-days: 1

# ============================================================
# STAGE 2 - TERRAFORM APPLY
# ============================================================
  apply:
    name: AWS - Terraform Apply
    if: ${{ inputs.operation == 'apply' }}
    needs: plan
    runs-on: self-hosted
    environment: aws-terraform-apply

    defaults:
      run:
        working-directory: terraform/AWS

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init -input=false -reconfigure

      - name: Download Terraform Plan Artifact
        uses: actions/download-artifact@v4
        with:
          name: aws-tfplan
          path: terraform/AWS

      - name: Terraform Apply
        run: terraform apply -input=false -lock-timeout=5m tfplan

      - name: Display Terraform Outputs
        run: terraform output

# ============================================================
# STAGE 3 - TERRAFORM DESTROY
# ============================================================
  destroy:
    name: AWS - Terraform Destroy
    if: ${{ inputs.operation == 'destroy' }}
    runs-on: self-hosted
    environment: aws-terraform-destroy

    defaults:
      run:
        working-directory: terraform/AWS

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init -input=false -reconfigure

      - name: Terraform Destroy Plan
        run: |
          terraform plan \
            -destroy \
            -var-file=aws.tfvars \
            -input=false \
            -lock-timeout=5m \
            -out=tf-destroy-plan

      - name: Display Destroy Plan
        run: terraform show -no-color tf-destroy-plan

      - name: Terraform Destroy Apply
        run: terraform apply -input=false -lock-timeout=5m -auto-approve tf-destroy-plan