# Unified multi-cloud Terraform pipeline
trigger: none
pr: none

parameters:
- name: deployAzure
  displayName: Deploy Azure
  type: boolean
  default: true

- name: deployAWS
  displayName: Deploy AWS
  type: boolean
  default: true

- name: deployGCP
  displayName: Deploy GCP
  type: boolean
  default: true

- name: operation
  displayName: Terraform operation
  type: string
  default: plan
  values:
  - plan
  - apply
  - destroy

stages:
- ${{ if eq(parameters.deployAzure, true) }}:
  - template: templates/azure-deployment.yml
    parameters:
      operation: ${{ parameters.operation }}

- ${{ if eq(parameters.deployAWS, true) }}:
  - template: templates/aws-deployment.yml
    parameters:
      operation: ${{ parameters.operation }}

- ${{ if eq(parameters.deployGCP, true) }}:
  - template: templates/gcp-deployment.yml
    parameters:
      operation: ${{ parameters.operation }}
