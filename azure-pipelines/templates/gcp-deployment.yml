parameters:
- name: operation
  type: string


stages:

- stage: GCPPlan
  displayName: Gcp - Terraform Plan
  dependsOn: []
  condition: and(succeeded(), or(eq('${{ parameters.operation }}', 'plan'), eq('${{ parameters.operation }}', 'apply')))
 
  jobs:
  - job: GCPPlanJob
    displayName: Gcp Plan
    pool:
      name: Local-Linux-Agents
  
    steps:
    - checkout: self
    - bash: terraform fmt -check -recursive
      displayName: Terraform Format Check
      workingDirectory: $(System.DefaultWorkingDirectory)/terraform/GCP
          - task: TerraformTaskV4@4
            displayName: Terraform Init
            inputs:
              provider: gcp
              command: init
              workingDirectory: $(System.DefaultWorkingDirectory)/terraform/GCP
              commandOptions: -input=false -reconfigure
              backendServiceGCP: sc-gcp-wlf
              backendGCPBucketName: mc-infra-gcp-tfstate-001
              backendGCPPrefix: multi-cloud-terraform-gha-nm/gcp
    
          - task: TerraformTaskV4@4
            displayName: Terraform Validate
            inputs:
              provider: gcp
              command: validate
              workingDirectory: $(System.DefaultWorkingDirectory)/terraform/GCP
    
          - task: TerraformTaskV4@4
            displayName: Terraform Plan
            inputs:
              provider: gcp
              command: plan
              workingDirectory: $(System.DefaultWorkingDirectory)/terraform/GCP
              commandOptions: -var-file=gcp.tfvars -input=false -lock-timeout=5m -out=tfplan
              environmentServiceNameGCP: sc-gcp-wlf
    
          - task: TerraformTaskV4@4
            displayName: Display Terraform Plan
            inputs:
              provider: gcp
              command: show
              workingDirectory: $(System.DefaultWorkingDirectory)/terraform/GCP
              outputTo: console
              outputFormat: default
              commandOptions: -no-color tfplan
    
          - task: PublishPipelineArtifact@1
            displayName: Publish GCP Terraform Plan
            inputs:
              targetPath: $(System.DefaultWorkingDirectory)/terraform/GCP/tfplan
              artifact: gcp-tfplan
              publishLocation: pipeline

- stage: GCPApply
  displayName: Gcp - Terraform Apply
  dependsOn: GCPPlan
  condition: and(succeeded(), eq('${{ parameters.operation }}', 'apply'))

  jobs:
  - job: GCPApplyJob
    displayName: Gcp Apply
    pool:
      name: Local-Linux-Agents
   
    steps:
    - checkout: self
          - task: DownloadPipelineArtifact@2
            displayName: Download GCP Terraform Plan
            inputs:
              buildType: current
              artifactName: gcp-tfplan
              targetPath: $(System.DefaultWorkingDirectory)/terraform/GCP

          - task: TerraformTaskV4@4
            displayName: Terraform Init
            inputs:
              provider: gcp
              command: init
              workingDirectory: $(System.DefaultWorkingDirectory)/terraform/GCP
              commandOptions: -input=false -reconfigure
              backendServiceGCP: sc-gcp-wlf
              backendGCPBucketName: mc-infra-gcp-tfstate-001
              backendGCPPrefix: multi-cloud-terraform-gha-nm/gcp

          - task: TerraformTaskV4@4
            displayName: Terraform Apply Saved Plan
            inputs:
              provider: gcp
              command: apply
              workingDirectory: $(System.DefaultWorkingDirectory)/terraform/GCP
              commandOptions: -input=false -lock-timeout=5m tfplan
              environmentServiceNameGCP: sc-gcp-wlf

          - task: TerraformTaskV4@4
            displayName: Display Terraform Outputs
            inputs:
              provider: gcp
              command: output
              workingDirectory: $(System.DefaultWorkingDirectory)/terraform/GCP

- stage: GCPDestroy
  displayName: Gcp - Terraform Destroy
  dependsOn: []
  condition: and(succeeded(), eq('${{ parameters.operation }}', 'destroy'))

  jobs:
  - job: GCPDestroyJob
    displayName: Gcp Destroy
    pool:
      name: Local-Linux-Agents
   
    steps:
    - checkout: self
          - task: TerraformTaskV4@4
            displayName: Terraform Init
            inputs:
              provider: gcp
              command: init
              workingDirectory: $(System.DefaultWorkingDirectory)/terraform/GCP
              commandOptions: -input=false -reconfigure
              backendServiceGCP: sc-gcp-wlf
              backendGCPBucketName: mc-infra-gcp-tfstate-001
              backendGCPPrefix: multi-cloud-terraform-gha-nm/gcp

          - task: TerraformTaskV4@4
            displayName: Terraform Destroy Plan
            inputs:
              provider: gcp
              command: plan
              workingDirectory: $(System.DefaultWorkingDirectory)/terraform/GCP
              commandOptions: -destroy -var-file=gcp.tfvars -input=false -lock-timeout=5m -out=tf-destroy-plan
              environmentServiceNameGCP: sc-gcp-wlf

          - task: TerraformTaskV4@4
            displayName: Display Terraform Destroy Plan
            inputs:
              provider: gcp
              command: show
              workingDirectory: $(System.DefaultWorkingDirectory)/terraform/GCP
              outputTo: console
              outputFormat: default
              commandOptions: -no-color tf-destroy-plan

          - task: TerraformTaskV4@4
            displayName: Terraform Destroy Apply
            inputs:
              provider: gcp
              command: apply
              workingDirectory: $(System.DefaultWorkingDirectory)/terraform/GCP
              commandOptions: -input=false -lock-timeout=5m tf-destroy-plan
              environmentServiceNameGCP: sc-gcp-wlf

