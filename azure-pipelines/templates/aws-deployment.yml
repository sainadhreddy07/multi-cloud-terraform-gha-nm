parameters:
- name: operation
  type: string


stages:

- stage: AWSPlan
  displayName: Aws - Terraform Plan
  dependsOn: []
  condition: and(succeeded(), or(eq('${{ parameters.operation }}', 'plan'), eq('${{ parameters.operation }}', 'apply')))
  
  jobs:
  - job: AWSPlanJob
    displayName: Aws Plan
    pool:
      name: Local-Linux-Agents
  
    steps:
    - checkout: self
    - bash: terraform fmt -check -recursive
      displayName: Terraform Format Check
      workingDirectory: $(System.DefaultWorkingDirectory)/terraform/AWS
          - task: TerraformTaskV4@4
            displayName: Terraform Init
            inputs:
              provider: aws
              command: init
              workingDirectory: $(System.DefaultWorkingDirectory)/terraform/AWS
              commandOptions: -input=false -reconfigure
              backendServiceAWS: sc-aws-terraform-wif
              backendAWSBucketName: multicloudbucket001
              backendAWSKey: multi-cloud-terraform-gha-nm/aws/terraform.tfstate
       
          - task: TerraformTaskV4@4
            displayName: Terraform Validate
            inputs:
              provider: aws
              command: validate
              workingDirectory: $(System.DefaultWorkingDirectory)/terraform/AWS
         
          - task: TerraformTaskV4@4
            displayName: Terraform Plan
            inputs:
              provider: aws
              command: plan
              workingDirectory: $(System.DefaultWorkingDirectory)/terraform/AWS
              commandOptions: -var-file=aws.tfvars -input=false -lock-timeout=5m -out=tfplan
              environmentServiceNameAWS: sc-aws-terraform-wif
      
          - task: TerraformTaskV4@4
            displayName: Display Terraform Plan
            inputs:
              provider: aws
              command: show
              workingDirectory: $(System.DefaultWorkingDirectory)/terraform/AWS
              outputTo: console
              outputFormat: default
              commandOptions: -no-color tfplan
        
          - task: PublishPipelineArtifact@1
            displayName: Publish AWS Terraform Plan
            inputs:
              targetPath: $(System.DefaultWorkingDirectory)/terraform/AWS/tfplan
              artifact: aws-tfplan
              publishLocation: pipeline

- stage: AWSApply
  displayName: Aws - Terraform Apply
  dependsOn: AWSPlan
  condition: and(succeeded(), eq('${{ parameters.operation }}', 'apply'))
  
  jobs:
  - job: AWSApplyJob
    displayName: Aws Apply
    pool:
      name: Local-Linux-Agents
   
    steps:
    - checkout: self
          - task: DownloadPipelineArtifact@2
            displayName: Download AWS Terraform Plan
            inputs:
              buildType: current
              artifactName: aws-tfplan
              targetPath: $(System.DefaultWorkingDirectory)/terraform/AWS
          
          - task: TerraformTaskV4@4
            displayName: Terraform Init
            inputs:
              provider: aws
              command: init
              workingDirectory: $(System.DefaultWorkingDirectory)/terraform/AWS
              commandOptions: -input=false -reconfigure
              backendServiceAWS: sc-aws-terraform-wif
              backendAWSBucketName: multicloudbucket001
              backendAWSKey: multi-cloud-terraform-gha-nm/aws/terraform.tfstate
          
          - task: TerraformTaskV4@4
            displayName: Terraform Apply Saved Plan
            inputs:
              provider: aws
              command: apply
              workingDirectory: $(System.DefaultWorkingDirectory)/terraform/AWS
              commandOptions: -input=false -lock-timeout=5m tfplan
              environmentServiceNameAWS: sc-aws-terraform-wif
          
          - task: TerraformTaskV4@4
            displayName: Display Terraform Outputs
            inputs:
              provider: aws
              command: output
              workingDirectory: $(System.DefaultWorkingDirectory)/terraform/AWS

- stage: AWSDestroy
  displayName: Aws - Terraform Destroy
  dependsOn: []
  condition: and(succeeded(), eq('${{ parameters.operation }}', 'destroy'))
  
  jobs:
  - job: AWSDestroyJob
    displayName: Aws Destroy
    pool:
      name: Local-Linux-Agents
  
    steps:
    - checkout: self
          - task: TerraformTaskV4@4
            displayName: Terraform Init
            inputs:
              provider: aws
              command: init
              workingDirectory: $(System.DefaultWorkingDirectory)/terraform/AWS
              commandOptions: -input=false -reconfigure
              backendServiceAWS: sc-aws-terraform-wif
              backendAWSBucketName: multicloudbucket001
              backendAWSKey: multi-cloud-terraform-gha-nm/aws/terraform.tfstate
  
          - task: TerraformTaskV4@4
            displayName: Terraform Destroy Plan
            inputs:
              provider: aws
              command: plan
              workingDirectory: $(System.DefaultWorkingDirectory)/terraform/AWS
              commandOptions: -destroy -var-file=aws.tfvars -input=false -lock-timeout=5m -out=tf-destroy-plan
              environmentServiceNameAWS: sc-aws-terraform-wif
  
          - task: TerraformTaskV4@4
            displayName: Display Terraform Destroy Plan
            inputs:
              provider: aws
              command: show
              workingDirectory: $(System.DefaultWorkingDirectory)/terraform/AWS
              outputTo: console
              outputFormat: default
              commandOptions: -no-color tf-destroy-plan
  
          - task: TerraformTaskV4@4
            displayName: Terraform Destroy Apply
            inputs:
              provider: aws
              command: apply
              workingDirectory: $(System.DefaultWorkingDirectory)/terraform/AWS
              commandOptions: -input=false -lock-timeout=5m tf-destroy-plan
              environmentServiceNameAWS: sc-aws-terraform-wif

