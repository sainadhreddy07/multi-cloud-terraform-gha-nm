parameters:
- name: operation
  type: string

stages:
- stage: AWSPlan
  displayName: AWS - Terraform Plan
  dependsOn: []
  condition: and(succeeded(), or(eq('${{ parameters.operation }}', 'plan'), eq('${{ parameters.operation }}', 'apply')))
  jobs:
  - job: AWSPlanJob
    displayName: AWS Plan
    pool:
      name: Local-Linux-Agents
    steps:
    - checkout: self
    - bash: terraform fmt -check -recursive
      displayName: Terraform Format Check
      workingDirectory: $(System.DefaultWorkingDirectory)/terraform/AWS
    - task: AWSShellScript@1
      displayName: Terraform Init and Validate
      inputs:
        awsCredentials: sc-aws-terraform-wif
        regionName: ap-south-1
        scriptType: inline
        inlineScript: |
          set -euo pipefail
          cd "$(System.DefaultWorkingDirectory)/terraform/AWS"
          terraform init -input=false -reconfigure
          terraform validate
    - task: AWSShellScript@1
      displayName: Terraform Plan
      inputs:
        awsCredentials: sc-aws-terraform-wif
        regionName: ap-south-1
        scriptType: inline
        inlineScript: |
          set -euo pipefail
          cd "$(System.DefaultWorkingDirectory)/terraform/AWS"
          terraform plan -var-file=aws.tfvars -input=false -lock-timeout=5m -out=tfplan
    - task: AWSShellScript@1
      displayName: Display Terraform Plan
      inputs:
        awsCredentials: sc-aws-terraform-wif
        regionName: ap-south-1
        scriptType: inline
        inlineScript: |
          set -euo pipefail
          cd "$(System.DefaultWorkingDirectory)/terraform/AWS"
          terraform show -no-color tfplan
    - task: PublishPipelineArtifact@1
      displayName: Publish AWS Terraform Plan
      inputs:
        targetPath: $(System.DefaultWorkingDirectory)/terraform/AWS/tfplan
        artifact: aws-tfplan
        publishLocation: pipeline

- stage: AWSApply
  displayName: AWS - Terraform Apply
  dependsOn: AWSPlan
  condition: and(succeeded(), eq('${{ parameters.operation }}', 'apply'))
  jobs:
  - job: AWSApplyJob
    displayName: AWS Apply
    pool:
      name: Local-Linux-Agents
    steps:
    - checkout: self
    - task: DownloadPipelineArtifact@2
      displayName: Download AWS Terraform Plan
      inputs:
        buildType: current
        artifactName: aws-tfplan
        targetPath: $(System.DefaultWorkingDirectory)/terraform/AWS
    - task: AWSShellScript@1
      displayName: Terraform Init and Apply Saved Plan
      inputs:
        awsCredentials: sc-aws-terraform-wif
        regionName: ap-south-1
        scriptType: inline
        inlineScript: |
          set -euo pipefail
          cd "$(System.DefaultWorkingDirectory)/terraform/AWS"
          terraform init -input=false -reconfigure
          terraform apply -input=false -lock-timeout=5m tfplan
          terraform output

- stage: AWSDestroy
  displayName: AWS - Terraform Destroy
  dependsOn: []
  condition: and(succeeded(), eq('${{ parameters.operation }}', 'destroy'))
  jobs:
  - job: AWSDestroyJob
    displayName: AWS Destroy
    pool:
      name: Local-Linux-Agents
    steps:
    - checkout: self
    - task: AWSShellScript@1
      displayName: Terraform Init and Create Destroy Plan
      inputs:
        awsCredentials: sc-aws-terraform-wif
        regionName: ap-south-1
        scriptType: inline
        inlineScript: |
          set -euo pipefail
          cd "$(System.DefaultWorkingDirectory)/terraform/AWS"
          terraform init -input=false -reconfigure
          terraform plan -destroy -var-file=aws.tfvars -input=false -lock-timeout=5m -out=tf-destroy-plan
          terraform show -no-color tf-destroy-plan
    - task: AWSShellScript@1
      displayName: Apply Terraform Destroy Plan
      inputs:
        awsCredentials: sc-aws-terraform-wif
        regionName: ap-south-1
        scriptType: inline
        inlineScript: |
          set -euo pipefail
          cd "$(System.DefaultWorkingDirectory)/terraform/AWS"
          terraform apply -input=false -lock-timeout=5m tf-destroy-plan
